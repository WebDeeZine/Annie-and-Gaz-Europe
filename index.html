const SHARED_FILES_API = "/api/travel-files";

function formatFileSize(bytes){
  if(bytes < 1024) return `${bytes} B`;
  if(bytes < 1024*1024) return `${Math.round(bytes/1024)} KB`;
  return `${(bytes/(1024*1024)).toFixed(1)} MB`;
}
function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
async function loadDayFiles(day){
  const res=await fetch(`${SHARED_FILES_API}?day=${day}`,{cache:"no-store"});
  if(!res.ok) throw new Error("Could not load shared files");
  return await res.json();
}
function renderDayFiles(day,files){
  const list=document.getElementById("filelist");
  const status=document.getElementById("filesstatus");
  if(!list||!status) return;
  if(!files.length){
    list.innerHTML="";
    status.textContent="No shared files for this day yet.";
    return;
  }
  status.textContent=`${files.length} shared file${files.length===1?"":"s"}`;
  list.innerHTML=files.map(file=>`<div class="sharedfile">
    <div class="sharedfile-main"><span class="sharedfile-name">${escapeHtml(file.name)}</span><span class="sharedfile-meta">${formatFileSize(file.size)} · ${new Date(file.uploadedAt).toLocaleDateString()}</span></div>
    <div class="sharedfile-actions"><a target="_blank" rel="noopener" href="${SHARED_FILES_API}?day=${day}&id=${encodeURIComponent(file.id)}">Open</a><button type="button" data-delete-file="${escapeHtml(file.id)}">Delete</button></div>
  </div>`).join("");
  list.querySelectorAll("[data-delete-file]").forEach(button=>button.addEventListener("click",async()=>{
    const name=button.closest(".sharedfile").querySelector(".sharedfile-name").textContent;
    if(!confirm(`Delete ${name} from this day?`)) return;
    button.disabled=true;
    status.textContent="Deleting file...";
    try{
      const res=await fetch(`${SHARED_FILES_API}?day=${day}&id=${encodeURIComponent(button.dataset.deleteFile)}`,{method:"DELETE"});
      if(!res.ok) throw new Error((await res.json()).error||"Delete failed");
      renderDayFiles(day,await loadDayFiles(day));
    }catch(err){ status.textContent=err.message||"Could not delete file"; button.disabled=false; }
  }));
}
async function wireDayFiles(day){
  const input=document.getElementById("dayfiles");
  const status=document.getElementById("filesstatus");
  if(!input||!status) return;
  try{ renderDayFiles(day,await loadDayFiles(day)); }
  catch(err){ status.textContent="Could not load shared files"; }
  input.addEventListener("change",async()=>{
    const selected=[...input.files];
    if(!selected.length) return;
    for(const file of selected){
      if(file.size > 3.5*1024*1024){ status.textContent=`${file.name} is larger than 3.5 MB`; continue; }
      status.textContent=`Uploading ${file.name}...`;
      try{
        const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file);});
        const res=await fetch(`${SHARED_FILES_API}?day=${day}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:file.name,type:file.type,data})});
        if(!res.ok){const detail=await res.json().catch(()=>({}));throw new Error(detail.error||`Could not upload ${file.name}`);}
      }catch(err){ status.textContent=err.message||`Could not upload ${file.name}`; input.value=""; return; }
    }
    input.value="";
    renderDayFiles(day,await loadDayFiles(day));
  });
}

const SHARED_API = "/api/travel-notes";
let sharedScoreState = null;
let sharedNotes = {};
let sharedDirty = false;
let sharedActiveDay = null;
let sharedTyping = false;

function normaliseSharedNotes(state){
  if(state && state.travelNotes && typeof state.travelNotes === "object") return state.travelNotes;
  return {};
}
async function loadSharedState(){
  const res = await fetch(SHARED_API, {cache:"no-store"});
  if(!res.ok) throw new Error("Could not load shared notes");
  const notes = await res.json();
  sharedNotes = notes && typeof notes === "object" ? notes : {};
  return sharedNotes;
}
async function saveSharedNotes(){
  await fetch(SHARED_API,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(sharedNotes)
  }).then(res=>{ if(!res.ok) throw new Error("Could not save shared notes"); });
}

async function wireNotes(d){
  sharedActiveDay = d.n;
  const box=document.getElementById("daynote");
  const status=document.getElementById("notesstatus");
  if(!box||!status) return;
  const key=String(d.n);
  try{
    await loadSharedState();
    box.value = sharedNotes[key] || "";
    status.textContent = "Shared notes loaded";
  }catch(err){
    status.textContent = "Could not load shared notes";
  }
  let t;
  box.addEventListener("input",()=>{
    sharedTyping = true;
    sharedNotes[key] = box.value;
    status.textContent = "Saving...";
    clearTimeout(t);
    t=setTimeout(async()=>{
      try{
        await saveSharedNotes();
        sharedDirty = false;
        status.textContent = "✓ Shared";
      }catch(err){
        status.textContent = "Save failed — check internet";
      }finally{
        setTimeout(()=>{ sharedTyping=false; }, 600);
      }
    },900);
  });
}
setInterval(async()=>{
  if(sharedTyping || sharedActiveDay===null) return;
  const box=document.getElementById("daynote");
  const status=document.getElementById("notesstatus");
  if(!box) return;
  try{
    await loadSharedState();
    const latest = sharedNotes[String(sharedActiveDay)] || "";
    if(document.activeElement !== box && box.value !== latest){
      box.value = latest;
      if(status) status.textContent = "Updated from shared notes";
    }
  }catch(err){}
},5000);

function cleanSchedule(items){
  const remove=[
    "easy local dinner","early night","choose one","use food","local walk","museum or thames",
    "pub or easy dinner","coffee and bakery","choose 1","seine or marais","main sightseeing",
    "relaxed neighbourhood","pack for early train","gothic quarter / rooftop / easy tapas",
    "easy gothic quarter","dinner near gothic","rest, unpack","recover","relax onboard",
    "rest day onboard","pack and relax","final cruise dinner"
  ];
  return (items||[]).map(([t,v])=>{
    let s=String(v);
    s=s.replace("Full-day KUL stopover — lounge, rest, or quick city option","Kuala Lumpur stopover / layover");
    s=s.replace("Immigration, baggage, coffee and transfer","Immigration, baggage and transfer");
    s=s.replace("Early check-in may be possible if host confirms closer to arrival","Possible early check-in if confirmed by host");
    s=s.replace("Short Marais walk and dinner","Check in / settle in Paris");
    s=s.replace("Hotel check-in from 3:00 pm","Hotel check-in from 3:00 pm");
    return [t,s];
  }).filter(([t,v])=>{
    const s=String(v).toLowerCase();
    return !remove.some(x=>s.includes(x));
  });
}

function itineraryDateISO(d){
  const m={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
  const parts=String(d.date||'').split(/\s+/);
  const day=parseInt(parts[1],10);
  const mon=(parts[2]||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!day || !(mon in m)) return null;
  const dt=new Date(Date.UTC(2026,m[mon],day));
  return dt.toISOString().slice(0,10);
}

function weatherCodeText(code){
  const c=Number(code);
  if([0].includes(c)) return 'Sunny';
  if([1].includes(c)) return 'Mostly sunny';
  if([2].includes(c)) return 'Partly cloudy';
  if([3].includes(c)) return 'Mostly cloudy';
  if([45,48].includes(c)) return 'Fog possible';
  if([51,53,55,56,57].includes(c)) return 'Drizzle';
  if([61,63,65,66,67,80,81,82].includes(c)) return 'Rain expected';
  if([71,73,75,77,85,86].includes(c)) return 'Snow possible';
  if([95,96,99].includes(c)) return 'Thunderstorms possible';
  return 'Forecast available';
}
function weatherOutlook(code, rainProb, rainMm){
  const prob = rainProb===null || rainProb===undefined ? 0 : Number(rainProb);
  const mm = rainMm===null || rainMm===undefined ? 0 : Number(rainMm);
  const coded = weatherCodeText(code);
  if(/Thunder/.test(coded)) return 'Thunderstorms possible';
  if(mm >= 20) return 'Heavy rain likely';
  if(mm >= 8) return 'Rain likely';
  if(mm >= 3 || prob >= 70) return 'Showers likely';
  if(mm >= 1 || prob >= 45) return 'Showers possible';
  if(mm > 0 || prob >= 20) return 'Slight shower chance';
  return coded;
}

async function loadWeatherForDay(d){

  if(!card) return;
  const place=weatherLocation(d);

  try{
    let g=place;
    if(g.search){
      const geoUrl=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(g.search)}&count=1&language=en&format=json`;
      const geo=await fetch(geoUrl,{cache:'no-store'}).then(r=>r.json());
      const found=geo && geo.results && geo.results[0];
      if(!found) throw new Error('Location not found');
      g={name:found.name + (found.country ? ', '+found.country : ''), lat:found.latitude, lon:found.longitude};
    }
    const fcUrl=`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lon}&daily=weather_code,temperature_2m_min,temperature_2m_max,precipitation_probability_max,precipitation_sum&timezone=auto&forecast_days=16`;
    const fc=await fetch(fcUrl,{cache:'no-store'}).then(r=>r.json());
    const target=itineraryDateISO(d);
    const times=(fc.daily&&fc.daily.time)||[];
    let idx=target ? times.indexOf(target) : -1;
    let label='Trip-day forecast';
    if(idx<0){ idx=0; label='Current outlook'; }
    const min=Math.round(fc.daily.temperature_2m_min[idx]);
    const max=Math.round(fc.daily.temperature_2m_max[idx]);
    const rainProb=fc.daily.precipitation_probability_max[idx];
    const rainMm=fc.daily.precipitation_sum[idx];
    const code=(fc.daily.weather_code||[])[idx];
    const outlook=weatherOutlook(code, rainProb, rainMm);
    const pills=card.querySelectorAll('.weatherpill b');
    pills[0].textContent=`Min ${min}°C`;
    pills[1].textContent=`Max ${max}°C`;
    pills[2].textContent=outlook;
    let status=`${label} for ${g.name}.`;
    if(label==='Current outlook' && target) status += ' Trip-date forecast will appear automatically once it is within the forecast window.';
    if(rainMm!==null && rainMm!==undefined && Number(rainMm)>0) status += ` Forecast rainfall about ${Number(rainMm).toFixed(rainMm>=1?1:0)} mm.`;
    card.querySelector('.weatherstatus').textContent=status;
  }catch(e){
    const pills=card.querySelectorAll('.weatherpill b');
    if(pills[0]) pills[0].textContent='Unavailable';
    if(pills[1]) pills[1].textContent='Unavailable';
    const st=card.querySelector('.weatherstatus');
    if(st) st.textContent='Live weather could not be loaded. Check your internet connection and tap Refresh.';
  }
}

function renderDay(i){const d=days[i];document.querySelectorAll('.daybtn').forEach((b,j)=>b.classList.toggle('active',j===i));const pct=Math.round(((i+1)/days.length)*100);let accom='';if(d.accom){const bookingLink=d.accom.bookingUrl?`<a class="linkitem" target="_blank" rel="noopener" href="${d.accom.bookingUrl}"><strong>${d.accom.bookingLabel||'Open accommodation booking'}</strong><span>›</span></a>`:'';accom=`<div class="card accom"><h3 class="section-title">Accommodation</h3><strong>${d.accom.name}</strong><br><span>${d.accom.address}</span><br><span class="muted">${d.accom.check}</span><br><span class="muted">${d.accom.extra}</span><div class="linkgrid" style="margin-top:10px">${bookingLink}<a class="linkitem" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(d.accom.address)}"><strong>Open accommodation in Google Maps</strong><span>›</span></a></div></div>`} else if(d.port) {accom=`<div class="card port"><h3 class="section-title">Port / location</h3><strong>${d.port}</strong><br><span class="muted">${d.transport||''}</span></div>`} else {accom=`<div class="card port"><h3 class="section-title">Travel / location</h3><strong>${d.loc}</strong><br><span class="muted">${d.transport||''}</span></div>`}
let quick = d.quick && d.quick.length ? `<div class="card" id="quick"><h3 class="section-title">Quick links</h3><div class="quick4">${d.quick.map(([t,u])=>`<a target="_blank" rel="noopener" href="${u}">${t}</a>`).join('')}</div></div>` : '';
app.innerHTML=`<div class="headline"><div class="bigemoji">${d.emoji}</div><div><h2>Day ${d.n} – ${d.title}</h2><p>${d.date} · ${d.sub}</p><div class="progress"><div style="width:${pct}%"></div></div><p class="muted">Day ${i+1} of ${days.length}</p></div></div>
${renderWeatherCard(d)}
${hasFirmSchedule(d) ? `<div class="card" id="schedule"><h3 class="section-title">Today at a glance</h3><div class="timeline">${cleanSchedule(d.schedule).map(([t,v])=>`<div class="tl"><span class="time">${t}</span><strong>${v}</strong></div>`).join('')}</div></div>` : ''}
${renderEditableNotes(d)}
<div class="twocol">${accom}<div class="card"><h3 class="section-title">Transport / tickets</h3>${d.transport||'No transport booked for this day.'}</div></div>
${renderTodayDocs(d)}
${renderMovementPlan(d)}
${quick}
${(d.explore||[]).length ? `<div class="card" id="explore"><h3 class="section-title">Recommendations & ideas</h3><div class="explore">${d.explore.map(([name,desc,url])=>`<a target="_blank" rel="noopener" href="${url}"><strong>${name}</strong><small>${desc}</small></a>`).join('')}</div></div>` : (d.cruise ? `<div class="card" id="explore"><h3 class="section-title">Recommendations & ideas</h3><div class="explore"><span class="muted">Sea day — enjoy the ship and check the Celebrity app for onboard activities.</span></div></div>` : '')}
${d.food && d.food.length ? `<div class="card" id="food"><h3 class="section-title">Food links</h3><div class="linkgrid">${d.food.map(([name,url])=>`<a class="linkitem" target="_blank" rel="noopener" href="${url}"><span><strong>${name}</strong><small>Google search for current ratings and opening hours</small></span><span>›</span></a>`).join('')}</div></div>` : ''}
`;wireNotes(d);wireDayFiles(d.n);loadWeatherForDay(d);
  currentDayIndex=i;
  const activeBtn=document.querySelectorAll('.daybtn')[i];
  if(activeBtn) activeBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  if(!restoringView) window.scrollTo({top:0,behavior:'smooth'});
}

function openDocSheet(file,name,detail){
  const info=docInfo[file]||{icon:"📄",title:name,summary:detail,details:["Open the original PDF if you need the full booking confirmation."]};
  document.getElementById("docsheet-title").textContent=`${info.icon||"📄"} ${info.title||name}`;
  document.getElementById("docsheet-summary").textContent=info.summary||detail||"";
  document.getElementById("docsheet-list").innerHTML=(info.details||[]).map(x=>`<li>${x}</li>`).join("");
  const returnDay=days[currentDayIndex]?.n||1;
  const returnScroll=Math.max(0,Math.round(window.scrollY));
  sessionStorage.setItem("itineraryReturnDay",String(returnDay));
  sessionStorage.setItem("itineraryReturnScroll",String(returnScroll));
  document.getElementById("docsheet-open").href=`viewer.html?file=${encodeURIComponent(file)}&title=${encodeURIComponent(info.title||name)}&day=${encodeURIComponent(returnDay)}&scroll=${encodeURIComponent(returnScroll)}`;
  document.getElementById("docsheet-open").target="_self";
  const sheet=document.getElementById("docsheet");
  sheet.classList.add("show");
  sheet.setAttribute("aria-hidden","false");
}
function closeDocSheet(){
  const sheet=document.getElementById("docsheet");
  if(!sheet) return;
  sheet.classList.remove("show");
  sheet.setAttribute("aria-hidden","true");
}
document.addEventListener("click",(ev)=>{
  const btn=ev.target.closest(".docopen");
  if(btn){
    ev.preventDefault();
    openDocSheet(btn.dataset.file,btn.dataset.name,btn.dataset.detail);
    return;
  }
  if(ev.target.id==="docsheet-close" || ev.target.id==="docsheet-cancel" || ev.target.id==="docsheet"){
    closeDocSheet();
  }
});
document.addEventListener("keydown",(ev)=>{ if(ev.key==="Escape") closeDocSheet(); });


document.addEventListener('click',(ev)=>{
  const btn=ev.target.closest('[data-weather-refresh]');
  if(btn){ const d=days.find(x=>String(x.n)===String(btn.dataset.weatherRefresh)); if(d) loadWeatherForDay(d); }
});

let currentDayIndex=0;
let restoringView=false;
days.forEach((d,i)=>{
  const b=document.createElement('button');
  b.className='daybtn'+(i===0?' active':'');
  b.innerHTML=`<span class="emoji">${d.emoji}</span><span class="dnum">Day ${d.n}</span><br><span class="ddate">${d.date.split(' ').slice(1).join(' ')}</span>`;
  b.addEventListener('click',()=>{
    history.replaceState(null,"",`index.html?day=${encodeURIComponent(d.n)}`);
    renderDay(i);
  });
  daysEl.appendChild(b);
});
const startupParams=new URLSearchParams(location.search);
const savedDay=Number(startupParams.get("day")||sessionStorage.getItem("itineraryReturnDay")||1);
const savedScroll=Number(startupParams.get("scroll")||sessionStorage.getItem("itineraryReturnScroll")||0);
const foundStartupIndex=days.findIndex(d=>d.n===savedDay);
const startupIndex=foundStartupIndex>=0?foundStartupIndex:0;
restoringView=true;
renderDay(startupIndex);
requestAnimationFrame(()=>{
  requestAnimationFrame(()=>{
    window.scrollTo({top:Number.isFinite(savedScroll)?savedScroll:0,behavior:"auto"});
    restoringView=false;
    sessionStorage.removeItem("itineraryReturnDay");
    sessionStorage.removeItem("itineraryReturnScroll");
  });
});
</script><script>
function ensureLB(){
 let lb=document.getElementById('lb');
 if(!lb){
   lb=document.createElement('div');
   lb.id='lb';
   lb.className='lightbox';
   lb.setAttribute('role','dialog');
   lb.setAttribute('aria-modal','true');
   lb.innerHTML='<button class="lbclose" type="button" aria-label="Close image">&times;</button><img alt="Expanded cruise route image">';
   document.body.appendChild(lb);
   lb.addEventListener('click',function(e){if(e.target===lb || e.target.classList.contains('lbclose')) closeLB();});
 }
 return lb;
}
function openLB(src){
 const lb=ensureLB();
 lb.querySelector('img').src=src;
 lb.classList.add('open');
 document.body.style.overflow='hidden';
}
function closeLB(){
 const lb=document.getElementById('lb');
 if(lb) lb.classList.remove('open');
 document.body.style.overflow='';
}
document.addEventListener('click',function(e){
 const img=e.target.closest('.cruiseimg');
 if(img){ e.preventDefault(); openLB(img.currentSrc || img.src); }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape') closeLB();});
</script></body></html>
